  /estimaciones-de-ingreso:
    post:
      tags: [Estimación de ingreso]
      operationId: estimarIngreso
      summary: Estimar el ingreso de quien no lo tiene verificado
      description: |
        Devuelve por separado el ingreso que reporta un tercero al IESS
        (`verificado`) y, para quien no lo tiene, un mínimo estimado sin verificar
        (`estimado`). Los dos bloques nunca se suman. Usa la última consulta de la
        persona: no consulta a ninguna fuente y, si la persona no se consultó
        antes, responde 404.

        El mínimo no es el ingreso de la persona: es el monto que el ingreso real
        supera con la seguridad que dice cada `minimo`. La estimación es a la fecha
        de la consulta (`consultadoEl`); pasados 90 días, `calidad.avisos` lo dice.
        Con el mismo modelo, la misma consulta da siempre el mismo resultado.

        `nivel` dice con qué se respondió: `0` sólo con lo verificado y `1` con los
        datos de la persona y su SRI. El `2`, con el buró, todavía no se entrega.
        Si no se estima, `estimado.aplica` es `false` y `estimado.motivo` dice por
        qué. Es `null` cuando no hay ninguno de los dos: un jubilado, cuya
        referencia de pensión todavía no se entrega, o una consulta sin datos.
      security:
        - oauth2: [estimaciones:crear]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoDeEstimacion'
            example:
              identificacion: '0000000001'
