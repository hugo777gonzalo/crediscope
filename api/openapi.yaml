openapi: 3.1.0

# Contrato de la API de CrediScope para instituciones financieras (IFI).
# Es la única fuente de verdad del contrato: de acá salen la validación de los
# pedidos, las pruebas de contrato, el simulador del sandbox y la guía de
# integración. El diseño y sus porqués están en
# docs/cumplimiento/api/propuesta-api-ifi.md (fuera de git mientras el
# repositorio sea público). Un cambio que rompe a un integrador no entra en la
# v1: va a la v2 (ver "Versiones" abajo).

info:
  title: API de CrediScope para instituciones financieras
  version: 1.0.0-borrador
  summary: Evaluación crediticia de una persona con fuentes de Ecuador y un modelo de lenguaje.
  description: |
    Este documento es la especificación técnica de la API (lo que se manda, lo
    que se recibe y cómo). No es el contrato comercial entre CrediScope y la
    IFI, que se firma aparte: en él la IFI declara que tiene la autorización
    de cada persona para consultarla.

    La IFI pide la evaluación de una persona y CrediScope:

    1. valida la identificación y la autorización del titular;
    2. consulta las fuentes contratadas (Novadata y, en la modalidad `plus`, el
       buró de la IFI: Equifax);
    3. arma el perfil estandarizado y aplica los controles de bloqueo, que son
       reglas fijas y prevalecen sobre el modelo;
    4. le pide el análisis al modelo con el marco interpretativo vigente;
    5. en las modalidades `pro` y `plus`, calcula la cuota del crédito pedido y
       si entra en el ingreso de la persona;
    6. entrega el resultado completo.

    ## Modalidades

    `POST /evaluaciones` corre una de tres modalidades (`modalidad`). Cada una
    es una configuración de los mismos módulos, no un camino aparte:

    | Modalidad | Qué corre | Qué exige |
    |---|---|---|
    | `basico` | Perfil, fuentes de ingreso y la recomendación del modelo | La identificación |
    | `pro` | Lo de `basico`, más la cuota del crédito y la capacidad de pago | Las condiciones del crédito: monto, plazo y tasa |
    | `plus` | Lo de `pro`, con el buró de la IFI: las cuotas de la capacidad salen de cada operación del buró | Lo de `pro`, y que el buró de la IFI sea Equifax |

    La recomendación del modelo y la capacidad de pago se entregan por
    separado, cada una en su bloque del resultado: ninguna regla las combina en
    una decisión.

    ## Módulos con puerta propia

    La cuota y la capacidad de pago también se pueden pedir solas, sin evaluar
    a la persona: `POST /simulaciones` calcula la cuota y la tabla de un crédito
    sin consultar a nadie, y `POST /capacidades-de-pago` mide si esa cuota entra
    en el ingreso, con lo que CrediScope ya sabe de la persona o con los datos
    que manda la IFI. Es el mismo cálculo que corre dentro de `pro` y `plus`.
    `POST /estimaciones-de-ingreso` devuelve el ingreso verificado y, para quien
    no lo tiene, un mínimo estimado, con lo que CrediScope ya sabe de la persona.

    ## Asincrónica, con espera opcional

    Consultar las fuentes y analizar toma de 40 segundos a varios minutos. Por
    eso `POST /evaluaciones` responde enseguida con un identificador (202) y el
    resultado se lee con `GET /evaluaciones/{id}` o llega un aviso al terminar.
    Quien prefiera esperar en el mismo pedido manda `Prefer: wait=N` (hasta 90
    segundos): si la evaluación termina antes, la respuesta es 200 con el
    resultado.

    ## Idempotencia

    Todo `POST` lleva `Idempotency-Key`. Repetir un pedido con la misma clave
    y el mismo cuerpo devuelve la misma evaluación y no vuelve a consultar ni a
    analizar: es la forma segura de reintentar ante un corte de red. La misma
    clave con otro cuerpo da 409. La `referencia` de la IFI también es única.

    ## Revisión humana

    El score y la recomendación son una ayuda: la decisión de crédito la toma
    una persona de la IFI (LOPDP, art. 20, y norma de la SPDP sobre
    inteligencia artificial). Por eso `requiereRevisionHumana` es siempre
    `true`, el resultado trae sus motivos, y la IFI informa lo que decidió con
    `POST /evaluaciones/{id}/decision`.

    ## Variabilidad declarada

    El mismo perfil analizado dos veces por el modelo puede variar unos 40
    puntos. Dentro de la vigencia del perfil, un pedido idéntico devuelve el
    mismo análisis (`trazabilidad.analisisReutilizado`).

    ## Errores

    Todo error es `application/problem+json` (RFC 9457) con `codigo` e
    `idPedido`. El `idPedido` es lo que hay que citar al pedir soporte. Los
    errores nunca llevan detalles internos.

    ## Topes

    Cada IFI tiene un tope por minuto, uno por día y uno de evaluaciones en
    curso, informados en los encabezados `RateLimit-Policy` y `RateLimit`
    (borrador del IETF). Si la espera estimada no alcanza para el plazo de la
    prioridad pedida, la respuesta es 503 `capacidad-agotada` con
    `Retry-After`: se rechaza a tiempo en vez de entregar tarde.

    ## Avisos

    Al terminar una evaluación se envía el aviso `evaluacion.terminada` a la
    dirección que la IFI registró con CrediScope (nunca en el pedido). El
    aviso no lleva datos personales: trae el id, y el resultado se lee con la
    credencial de la IFI. Va firmado según Standard Webhooks (HMAC-SHA256).

    ## Versiones

    La versión mayor va en la ruta (`/v1`). Dentro de la v1 sólo se agregan
    campos opcionales: el integrador tiene que ignorar los que no conoce. Un
    cambio que rompe es la `/v2`, con seis meses de convivencia anunciados con
    los encabezados `Deprecation` (RFC 9745) y `Sunset` (RFC 8594).

    ## Sandbox

    El sandbox no consulta a ninguna persona: devuelve respuestas fijas para
    identificaciones de prueba que empiezan con `00`, una provincia que no
    existe. Ninguna puede ser de una persona real, y producción las rechaza
    con `identificacion-invalida`.

    | Identificación | Resultado en el sandbox |
    |---|---|
    | `0000000001` | `completada`: "aprobar", por el modelo |
    | `0000000002` | `completada`: "revisar", con `completitud: parcial` |
    | `0000000003` | `completada`: "negar", por un control de bloqueo |
    | `0000000004` | `completada`: `sin_veredicto` (el modelo no estuvo disponible) |
    | `0000000005` | `persona_no_encontrada` |
    | `0000000006` | `fallida`: `fuentes_no_disponibles` |
    | `0000000007` | Tarda 120 segundos en terminar, para probar la espera y los avisos |
  contact:
    name: CrediScope
  license:
    name: Propietaria. Uso reservado a las IFI con contrato vigente con CrediScope.
    identifier: LicenseRef-CrediScope-Propietaria

servers:
  - url: https://api.crediscope.example/v1
    description: Producción (la dirección definitiva se fija antes de la primera IFI externa)
  - url: https://sandbox.crediscope.example/v1
    description: Sandbox, con respuestas fijas y sin consultar a personas

security:
  - oauth2: []

tags:
  - name: Acceso
    description: Fichas de acceso de 10 minutos, con OAuth 2.0.
  - name: Evaluaciones
    description: Pedir una evaluación, seguirla y leer el resultado.
  - name: Decisiones
    description: Lo que decidió la persona que revisó en la IFI.
  - name: Simulador
    description: La cuota de un crédito de consumo con el seguro de desgravamen, sin consultar a nadie.
  - name: Capacidad de pago
    description: Si la cuota de un crédito entra en el ingreso de una persona.
  - name: Estimación de ingreso
    description: El ingreso que reporta un tercero y, para quien no lo tiene, un mínimo estimado sin verificar.
  - name: Servicio
    description: Estado del servicio.

paths:
  /oauth/token:
    post:
      tags: [Acceso]
      operationId: pedirFicha
      summary: Pedir una ficha de acceso
      description: |
        OAuth 2.0 con credenciales de cliente (RFC 6749, sección 4.4), y la IFI
        se autentica con `private_key_jwt` (RFC 7523): firma una aserción JWT
        con su clave privada, cuya clave pública registró en CrediScope.
        CrediScope no guarda ningún secreto de la IFI.

        La aserción lleva `iss` y `sub` iguales al `client_id`, `aud` igual a
        la URL de esta operación, `exp` de 5 minutos como máximo y un `jti`
        que no se puede repetir. Se firma con ES256 o PS256. El pedido tiene
        que salir de una IP permitida para esa IFI.

        La ficha dura 10 minutos. Los errores de esta operación siguen el
        formato de OAuth 2.0 (RFC 6749, sección 5.2), no el de RFC 9457.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PedidoDeFicha'
            example:
              grant_type: client_credentials
              client_assertion_type: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
              client_assertion: <aserción JWT firmada con la clave privada de la IFI>
              scope: evaluaciones:crear evaluaciones:leer
      responses:
        '200':
          description: Ficha emitida.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ficha'
              example:
                access_token: <ficha de acceso emitida por CrediScope>
                token_type: Bearer
                expires_in: 600
                scope: evaluaciones:crear evaluaciones:leer
        '400':
          description: Pedido inválido según OAuth 2.0.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOAuth'
              example:
                error: invalid_scope
                error_description: El alcance pedido no está habilitado para este cliente.
        '401':
          description: La aserción no es válida, venció, ya se usó, o la IP no está permitida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOAuth'
              example:
                error: invalid_client
                error_description: La aserción del cliente no es válida.

  /evaluaciones:
    post:
      tags: [Evaluaciones]
      operationId: crearEvaluacion
      summary: Pedir la evaluación de una persona
      description: |
        Valida el pedido, lo deja en la cola y responde con el id (202). Con
        `Prefer: wait=N`, espera hasta N segundos: si la evaluación termina
        antes, responde 200 con el resultado y `Preference-Applied`.

        Si la persona tiene un perfil vigente (consultado hace menos de los
        días que fija la configuración), se reutiliza y no se vuelve a
        consultar a las fuentes. Si ya hay un análisis del mismo pedido al
        modelo, se reutiliza también. Las dos cosas se informan en
        `trazabilidad`.

        La `modalidad` decide qué se evalúa (ver "Modalidades" arriba). Con
        `pro` o `plus` hay que mandar `solicitudDeCredito` con monto, plazo y
        tasa; sin eso, 400 `cuerpo-invalido`. `plus` también da 400 si el buró
        de la IFI no es Equifax.
      security:
        - oauth2: [evaluaciones:crear]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Prefer'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoDeEvaluacion'
            examples:
              basico:
                summary: Básico, sin condiciones del crédito
                value:
                  persona:
                    tipoIdentificacion: cedula
                    identificacion: '0000000001'
                  autorizacion:
                    id: AUT-2026-000123
                    otorgadaEl: '2026-10-09T10:02:00-05:00'
                    canal: firma_electronica
                    finalidad: evaluacion_de_credito
                    huellaDelDocumento: sha256:9f2b5c0e7a1d4b8c6e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d
                  solicitudDeCredito:
                    producto: consumo
                    monto: 8000
                    moneda: USD
                    plazoMeses: 36
                    destino: capital de trabajo
                  referencia: SOL-2026-55555
                  operador:
                    id: u-4821
                    agencia: Matriz
                  prioridad: interactiva
              pro:
                summary: Pro, con la cuota y la capacidad de pago
                value:
                  persona:
                    tipoIdentificacion: cedula
                    identificacion: '0000000001'
                  autorizacion:
                    id: AUT-2026-000124
                    otorgadaEl: '2026-10-09T10:02:00-05:00'
                    canal: firma_electronica
                    finalidad: evaluacion_de_credito
                    huellaDelDocumento: sha256:9f2b5c0e7a1d4b8c6e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d
                  modalidad: pro
                  solicitudDeCredito:
                    producto: consumo
                    monto: 8000
                    moneda: USD
                    plazoMeses: 36
                    tasaNominalAnualPorcentaje: 15
                  referencia: SOL-2026-55558
                  operador:
                    id: u-4821
                    agencia: Matriz
                  prioridad: interactiva
      responses:
        '202':
          description: Aceptada. El resultado se lee con `GET /evaluaciones/{id}` o llega el aviso.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            x-crediscope-version:
              $ref: '#/components/headers/XCrediscopeVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluacionAceptada'
              example:
                id: ev_01JABCD2EFGH3JKMN4PQRS5TVW
                estado: recibida
                referencia: SOL-2026-55555
                recibidaEl: '2026-10-09T10:02:03-05:00'
                esperaEstimadaSegundos: 75
        '200':
          description: Terminó dentro de la espera pedida con `Prefer`. Trae el resultado completo.
          headers:
            Preference-Applied:
              $ref: '#/components/headers/PreferenceApplied'
            Location:
              $ref: '#/components/headers/Location'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            x-crediscope-version:
              $ref: '#/components/headers/XCrediscopeVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluacion'
              examples:
                completada:
                  $ref: '#/components/examples/EvaluacionCompletada'
                completadaPro:
                  $ref: '#/components/examples/EvaluacionCompletadaPro'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          $ref: '#/components/responses/ClaveReutilizada'
        '413':
          $ref: '#/components/responses/CuerpoDemasiadoGrande'
        '415':
          $ref: '#/components/responses/TipoNoSoportado'
        '422':
          $ref: '#/components/responses/AutorizacionInsuficiente'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '503':
          $ref: '#/components/responses/NoDisponible'

    get:
      tags: [Evaluaciones]
      operationId: buscarEvaluaciones
      summary: Buscar evaluaciones por la referencia de la IFI
      description: |
        Devuelve las evaluaciones de la IFI con esa referencia, la más nueva
        primero. Suele ser una sola; son varias cuando hubo un reanálisis
        (`reemplazaA`).
      security:
        - oauth2: [evaluaciones:leer]
      parameters:
        - name: referencia
          in: query
          required: true
          description: La referencia propia de la IFI, la misma que mandó al pedir la evaluación.
          schema:
            $ref: '#/components/schemas/Referencia'
      responses:
        '200':
          description: Evaluaciones con esa referencia (puede ser una lista vacía).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            x-crediscope-version:
              $ref: '#/components/headers/XCrediscopeVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaDeEvaluaciones'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /evaluaciones/{id}:
    get:
      tags: [Evaluaciones]
      operationId: leerEvaluacion
      summary: Ver el estado de una evaluación y, al terminar, su resultado
      description: |
        Mientras está en curso, `Retry-After` dice cuándo conviene volver a
        preguntar. Un id que no existe y un id de otra IFI responden igual
        (404): no se revela si existe.
      security:
        - oauth2: [evaluaciones:leer]
      parameters:
        - $ref: '#/components/parameters/IdEvaluacion'
      responses:
        '200':
          description: La evaluación, con el resultado si ya terminó.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            x-crediscope-version:
              $ref: '#/components/headers/XCrediscopeVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluacion'
              examples:
                enProceso:
                  $ref: '#/components/examples/EvaluacionEnProceso'
                completada:
                  $ref: '#/components/examples/EvaluacionCompletada'
                completadaPro:
                  $ref: '#/components/examples/EvaluacionCompletadaPro'
                sinVeredicto:
                  $ref: '#/components/examples/EvaluacionSinVeredicto'
                fallida:
                  $ref: '#/components/examples/EvaluacionFallida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrada'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /evaluaciones/{id}/decision:
    post:
      tags: [Decisiones]
      operationId: informarDecision
      summary: Informar qué decidió la persona que revisó
      description: |
        La IFI informa la decisión humana sobre la solicitud: la exige la
        norma de la SPDP sobre inteligencia artificial y es lo que permite
        medir si el criterio sirve. Se puede informar más de una vez (por
        ejemplo, si la decisión se corrige): vale la última y todas quedan
        registradas. Sólo sobre evaluaciones `completada`.
      security:
        - oauth2: [decisiones:escribir]
      parameters:
        - $ref: '#/components/parameters/IdEvaluacion'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Decision'
            example:
              decision: aprobado
              decididaEl: '2026-10-09T11:30:00-05:00'
              decididaPor: u-0077
              montoAprobado: 6000
              plazoMesesAprobado: 24
              motivo: Se aprobó un monto menor al pedido por la carga de deuda actual.
      responses:
        '204':
          description: Registrada.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            x-crediscope-version:
              $ref: '#/components/headers/XCrediscopeVersion'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrada'
        '409':
          $ref: '#/components/responses/EstadoNoPermite'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /evaluaciones/{id}/cancelacion:
    post:
      tags: [Evaluaciones]
      operationId: cancelarEvaluacion
      summary: Cancelar una evaluación antes de que se consulten las fuentes
      description: |
        Sirve, por ejemplo, cuando el titular retira su autorización o la
        solicitud se pidió por error. Si las fuentes ya se consultaron, la
        consulta quedó hecha y registrada: responde 409.
      security:
        - oauth2: [evaluaciones:crear]
      parameters:
        - $ref: '#/components/parameters/IdEvaluacion'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Cancelada.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            x-crediscope-version:
              $ref: '#/components/headers/XCrediscopeVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluacionAceptada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrada'
        '409':
          $ref: '#/components/responses/EstadoNoPermite'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /simulaciones:
    post:
      tags: [Simulador]
      operationId: simularCredito
      summary: Simular la cuota de un crédito de consumo
      description: |
        Calcula la cuota mensual con el seguro de desgravamen y la tabla de
        amortización. No consulta a ninguna persona ni a ninguna fuente: se
        puede llamar sola, sin pedir una evaluación. Es el mismo cálculo que
        usan la capacidad de pago y la pantalla del analista.

        La tasa es nominal anual y opcional. Sin tasa se evalúa con la Tasa
        máxima del producto (15,6% para consumo, que la IFI puede bajar); con
        una tasa, la IFI pide evaluar con una menor, desde la Tasa mínima (0%:
        financiamiento sin interés). Nunca negativa ni mayor que la máxima: si
        no, 400 con el código de cada error en `errores`
        (`ErrorDeCondiciones`). El seguro de
        desgravamen es, si no se indica otro, 0,6% anual sobre el saldo de cada
        mes. Cada valor se redondea al centavo en su mes y la última cuota
        ajusta la diferencia. Los importes van en dólares con dos decimales, que es
        lo que cobra una institución. Las tasas y fracciones (`tasaMensual`,
        `tasaEfectivaAnual`, las cargas de la capacidad) llegan con la
        precisión completa del cálculo (más de 8 decimales) y sin redondear:
        se redondean sólo al mostrarlas.

        El producto de referencia es el de consumo: para otros productos la
        tasa máxima no aplica y todavía no hay parámetros.
      security:
        - oauth2: [simulaciones:crear]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoDeSimulacion'
            example:
              monto: 5000
              plazoMeses: 36
              tasaNominalAnualPorcentaje: 15
              sistema: frances
              desgravamen:
                tasaPorcentaje: 0.6
                periodicidad: anual
                base: saldo
              incluirTabla: false
