  /capacidades-de-pago:
    post:
      tags: [Capacidad de pago]
      operationId: evaluarCapacidadDePago
      summary: Medir si la cuota de un crédito entra en el ingreso de una persona
      description: |
        Simula la cuota del crédito pedido y la compara con el ingreso neto de
        la persona y lo que ya paga por mes. Se puede llamar sola, sin pedir una
        evaluación, de dos maneras:

        - con `identificacion`: usa lo que CrediScope ya sabe de la persona (el
          ingreso reportado al IESS y las cuotas del buró de la IFI, o las de
          cooperativas de Novadata si no hay buró). No consulta a ninguna
          fuente; si la persona no se consultó antes, responde 404. Si además
          vienen `ingresos` u `obligaciones`, se ignoran: manda la
          identificación;
        - con `ingresos` y `obligaciones`: usa los datos que manda la IFI (por
          ejemplo, del rol de pagos) y no lee nada de CrediScope. Sin ningún
          ingreso, el veredicto es `sin_ingreso`: no es un rechazo, es que no
          hay con qué medir.

        `ingresoDeclarado` es lo que la persona que pide el crédito dice que
        recibe por mes. Si viene (y es mayor que cero), reemplaza al ingreso
        reportado al IESS en el cálculo (es el total, no se suma al IESS), no se
        le descuenta nada y el resultado lo marca como no verificado
        (`ingresoDeclarado: true`). Sirve también con la segunda manera, sin
        `ingresos`. Con `identificacion` e `ingresoDeclarado`, la respuesta trae
        además `capacidadSoloIess` (lo que daría sólo el IESS), para comparar;
        en cualquier otro caso es `null`.

        Al sueldo de un dependiente se le descuenta el aporte personal al IESS.
        Una deuda sin cuota informada no se cuenta como cero: se devuelve en
        `datos.deudasSinCuota` y `obligacionesIncompletas` es `true`. `datos`
        dice con qué ingresos y cuotas se midió (con el Ingreso declarado, el
        único ingreso es el declarado).
      security:
        - oauth2: [capacidades:crear]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoDeCapacidad'
            examples:
              conLosDatosDeLaIfi:
                summary: Con los datos que manda la IFI, sin consultar a nadie
                value:
                  ingresos:
                    - concepto: Sueldo del rol de pagos
                      montoMensual: 1200
                      tipo: sueldo
                  obligaciones:
                    - concepto: Tarjeta de crédito
                      montoMensual: 85
                  solicitud:
                    monto: 5000
                    plazoMeses: 36
                    tasaNominalAnualPorcentaje: 15
                  parametros:
                    cargaMaxima: 0.4
              conUnaPersonaYSuIngresoDeclarado:
                summary: Con una persona ya consultada y lo que dice recibir
                value:
                  identificacion: '0000000001'
                  ingresoDeclarado: 1800
                  solicitud:
                    monto: 5000
                    plazoMeses: 36
                    tasaNominalAnualPorcentaje: 15
      responses:
        '200':
          description: La capacidad de pago, la simulación y el monto máximo que alcanza.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            x-crediscope-version:
