webhooks:
  evaluacionTerminada:
    post:
      tags: [Evaluaciones]
      operationId: avisarEvaluacionTerminada
      summary: Aviso de que una evaluación llegó a un estado final
      description: |
        CrediScope lo envía a la dirección https que la IFI registró. Firma
        según Standard Webhooks: `webhook-signature` es
        `v1,<base64 de HMAC-SHA256(secreto, webhook-id + "." + webhook-timestamp + "." + cuerpo)>`.
        La IFI tiene que verificar la firma, rechazar los avisos con más de 5
        minutos y descartar los `webhook-id` repetidos.

        Si la IFI no responde 2xx en 10 segundos, se reintenta durante 24 horas
        (a los 1, 5, 15 y 60 minutos, y a las 3, 6, 12 y 24 horas). El resultado
        se puede leer igual con `GET /evaluaciones/{id}`.
      parameters:
        - name: webhook-id
          in: header
          required: true
          description: Identificador único del aviso; se repite igual en los reintentos.
          schema:
            type: string
            maxLength: 64
        - name: webhook-timestamp
          in: header
          required: true
          description: Segundos desde 1970 (UTC) en que se firmó.
          schema:
            type: integer
        - name: webhook-signature
          in: header
          required: true
          description: Firma HMAC-SHA256, con el prefijo de versión.
          schema:
            type: string
            pattern: '^v1,[A-Za-z0-9+/=]+( v1,[A-Za-z0-9+/=]+)*$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Aviso'
            example:
              tipo: evaluacion.terminada
              id: ev_01JABCD2EFGH3JKMN4PQRS5TVW
              estado: completada
              referencia: SOL-2026-55555
              ocurridoEl: '2026-10-09T10:03:21-05:00'
      responses:
        '200':
          description: Recibido. Cualquier 2xx sirve.
        '204':
          description: Recibido.

components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: |
        Credenciales de cliente con autenticación `private_key_jwt` (ver
        `POST /oauth/token`), desde las IP permitidas para la IFI. La ficha va
        en `Authorization: Bearer`.
      flows:
        clientCredentials:
          tokenUrl: https://api.crediscope.example/v1/oauth/token
          scopes:
            evaluaciones:crear: Pedir y cancelar evaluaciones.
            evaluaciones:leer: Leer evaluaciones y sus resultados.
            decisiones:escribir: Informar la decisión humana.
            simulaciones:crear: Simular la cuota de un crédito.
            capacidades:crear: Medir la capacidad de pago de una persona.
            estimaciones:crear: Estimar el ingreso de una persona.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Clave única por pedido, generada por la IFI (se recomienda un UUID).
        Se conserva mientras exista la evaluación que creó. Para reintentar, se repite la misma clave.
      schema:
        type: string
        minLength: 8
        maxLength: 255
      example: 6f1c2a9e-0d4b-4c35-9a51-2f7d8e3b1c40
    Prefer:
      name: Prefer
      in: header
      required: false
      description: '`wait=N` (RFC 7240): esperar hasta N segundos (1 a 90) a que la evaluación termine.'
      schema:
        type: string
        pattern: '^wait=([1-9]|[1-8][0-9]|90)$'
      example: wait=60
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: Contexto de traza (W3C Trace Context), si la IFI lo usa. Queda en el registro del pedido.
      schema:
        type: string
        pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
    IdEvaluacion:
      name: id
      in: path
      required: true
      description: El id que devolvió `POST /evaluaciones`.
      schema:
        $ref: '#/components/schemas/IdEvaluacion'

  headers:
    Location:
      description: Dirección de la evaluación.
      schema:
        type: string
        format: uri-reference
        example: /v1/evaluaciones/ev_01JABCD2EFGH3JKMN4PQRS5TVW
    RetryAfter:
      description: Segundos que conviene esperar antes de volver a preguntar o reintentar.
      schema:
        type: integer
        minimum: 1
        example: 15
    PreferenceApplied:
      description: La preferencia que se respetó (RFC 7240).
      schema:
        type: string
        example: wait=60
    RateLimitPolicy:
      description: Topes de la IFI (borrador del IETF `RateLimit` header fields).
      schema:
        type: string
        example: '"por-minuto";q=60;w=60, "por-dia";q=20000;w=86400'
    RateLimit:
      description: Lo que queda de cada tope (borrador del IETF `RateLimit` header fields).
      schema:
        type: string
        example: '"por-minuto";r=42;t=18'
    XRequestId:
      description: 'Identificador del pedido. Es el mismo `idPedido` de los errores: citarlo al pedir soporte.'
      schema:
        type: string
        example: ped_8f3a2c1d9e
    XCrediscopeVersion:
      description: Versión del código que contestó.
      schema:
        type: string
        example: 1.0.0+0934d0d
    CacheControl:
      description: Los resultados tienen datos de buró y no se guardan en ningún intermediario.
      schema:
        type: string
        const: no-store

  schemas:
    PedidoDeFicha:
      type: object
      additionalProperties: false
      required: [grant_type, client_assertion_type, client_assertion]
      properties:
        grant_type:
          type: string
          const: client_credentials
        client_assertion_type:
          type: string
          const: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
        client_assertion:
          type: string
          description: Aserción JWT firmada con la clave privada de la IFI.
          maxLength: 4096
        scope:
          type: string
          description: Alcances pedidos, separados por espacio. Sin este campo, se emiten todos los habilitados.
          example: evaluaciones:crear evaluaciones:leer

    Ficha:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          description: Segundos de vida de la ficha.
          example: 600
        scope:
          type: string

    ErrorOAuth:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_request, invalid_client, invalid_grant, unauthorized_client, unsupported_grant_type, invalid_scope]
        error_description:
          type: string

    IdEvaluacion:
      type: string
      description: '`ev_` seguido de un ULID (26 caracteres, base32 de Crockford).'
      pattern: '^ev_[0-9A-HJKMNP-TV-Z]{26}$'
      example: ev_01JABCD2EFGH3JKMN4PQRS5TVW

    Referencia:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9._/-]+$'
      description: Referencia propia de la IFI (por ejemplo, su número de solicitud). Única por IFI.
      example: SOL-2026-55555

    PedidoDeEvaluacion:
      type: object
      additionalProperties: false
      required: [persona, autorizacion, referencia, operador]
      properties:
        persona:
          $ref: '#/components/schemas/Persona'
        autorizacion:
          $ref: '#/components/schemas/Autorizacion'
        solicitudDeCredito:
          $ref: '#/components/schemas/SolicitudDeCredito'
        modalidad:
          type: string
          enum: [basico, pro, plus]
          default: basico
          description: |
            Qué se evalúa. `basico`: el perfil, las fuentes de ingreso y la
            recomendación del modelo. `pro`: además, la cuota del crédito pedido
            y la capacidad de pago (exige `solicitudDeCredito` con monto, plazo y
            tasa, y por ahora sólo del producto de consumo). `plus`: además, el
            buró de la IFI: las cuotas de la capacidad salen de las operaciones
            que trae Equifax en lugar de las de Novadata. Exige que el buró de la
            IFI sea Equifax, y si la persona no tiene una consulta vigente, se
            consulta (y esa consulta se cobra). La recomendación del modelo y la
            capacidad de pago se entregan por separado: no se combinan en una
            decisión.
        referencia:
          $ref: '#/components/schemas/Referencia'
        operador:
          $ref: '#/components/schemas/Operador'
        prioridad:
          type: string
          enum: [interactiva, diferida]
          default: interactiva
          description: |
            `interactiva`: la persona espera en la ventanilla; plazo de 15
            minutos y se atiende primero. `diferida`: cartera o campañas;
            plazo de 24 horas.
        recibirPerfil:
          type: boolean
          default: true
          description: |
            Sólo tiene efecto si la configuración de la IFI habilita la
            entrega del perfil estandarizado. Con `false`, no se entrega
            aunque esté habilitada.
        reemplazaA:
          $ref: '#/components/schemas/IdEvaluacion'
          description: |
            Para pedir de nuevo el análisis de una evaluación que terminó
            `sin_veredicto`. Reutiliza el perfil de esa evaluación: no vuelve
            a consultar las fuentes. La evaluación original no cambia.

    Persona:
      type: object
      additionalProperties: false
      required: [tipoIdentificacion, identificacion]
      properties:
        tipoIdentificacion:
          type: string
          enum: [cedula, ruc]
          description: Un RUC de persona natural se convierte en su cédula. El RUC de una sociedad y el pasaporte se rechazan.
        identificacion:
          type: string
          pattern: '^[0-9]{10}([0-9]{3})?$'
          description: |
            10 dígitos (cédula) o 13 (RUC). Además del formato, se validan la
            provincia y el dígito verificador.

    Autorizacion:
      type: object
      additionalProperties: false
      required: [id, otorgadaEl, canal, finalidad, huellaDelDocumento]
      description: |
        La autorización previa, expresa e informada del titular, que la IFI
        recoge y conserva (contrato de encargo, cláusula 2). CrediScope guarda
        estos datos y la huella del documento, no el documento.
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          description: Identificador de la autorización en los registros de la IFI.
        otorgadaEl:
          type: string
          format: date-time
        vigenteHasta:
          type: string
          format: date
          description: Si la autorización vence, hasta cuándo vale. Vencida, se rechaza con 422.
        canal:
          type: string
          enum: [firma_electronica, documento_fisico_digitalizado, aceptacion_electronica]
        finalidad:
          type: string
          enum: [evaluacion_de_credito]
        huellaDelDocumento:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          description: SHA-256 del documento o de la constancia de aceptación, para el muestreo de autorizaciones.

    SolicitudDeCredito:
      type: object
      additionalProperties: false
      description: |
        Las condiciones del crédito que pide la persona. En `basico` es
        opcional y sólo se guarda. En `pro` y `plus` son obligatorios `monto`,
        `plazoMeses`, y `tasaNominalAnualPorcentaje` es opcional (sin ella, la
        Tasa máxima del producto): con ellos se calcula la cuota y la capacidad
        de pago. El modelo todavía no las lee: el marco
        interpretativo las incorporará más adelante.
      properties:
        producto:
          type: string
          enum: [consumo, microcredito, productivo, educativo, inmobiliario, vivienda_interes_social_publico, otro]
          description: Los cálculos de `pro` y `plus` usan los parámetros del producto de consumo (Tasa mínima de 0%, Tasa máxima de 15,6%, desgravamen de 0,6% anual).
        monto:
          type: number
          exclusiveMinimum: 0
          maximum: 1000000000
          multipleOf: 0.01
          description: En dólares. En las modalidades `pro` y `plus` va de 1.000 a 120.000 (producto de consumo).
        moneda:
          type: string
          const: USD
          default: USD
        plazoMeses:
          type: integer
          minimum: 1
          maximum: 480
          description: En meses. En las modalidades `pro` y `plus` va de 6 a 120 (producto de consumo).
        destino:
          type: string
          maxLength: 200
        garantia:
          type: string
          maxLength: 200
        tasaNominalAnualPorcentaje:
          type: number
          minimum: 0
          maximum: 15.6
          description: Nominal anual, en porcentaje. Opcional en `pro` y `plus`; sin ella se evalúa (y se guarda) la Tasa máxima del producto. Va de la Tasa mínima (0%, financiamiento sin interés) a la Tasa máxima (15,6% para consumo); nunca negativa.
        sistema:
          type: string
          enum: [frances, aleman]
          default: frances
        desgravamen:
          $ref: '#/components/schemas/Desgravamen'
        ingresoDeclarado:
          type: number
          minimum: 0
          maximum: 1000000000
          description: Lo que la persona dice que recibe por mes, en dólares. En la capacidad de pago reemplaza al ingreso del IESS y se marca sin verificar. Con 0 (o menos de medio centavo) no reemplaza nada. Sólo se usa en `pro` y `plus`.

    Operador:
      type: object
      additionalProperties: false
      required: [id]
      description: Quién pidió la evaluación dentro de la IFI. Hace falta para responder "¿quién vio mis datos?" y para los topes por operador.
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        agencia:
          type: string
          maxLength: 100

    EvaluacionAceptada:
      type: object
      required: [id, estado, referencia, recibidaEl]
      properties:
        id:
          $ref: '#/components/schemas/IdEvaluacion'
        estado:
          $ref: '#/components/schemas/Estado'
        referencia:
          $ref: '#/components/schemas/Referencia'
        recibidaEl:
          type: string
          format: date-time
        esperaEstimadaSegundos:
          type: integer
          minimum: 0
          description: Estimación según la cola y el ritmo de los últimos 10 minutos.

    Estado:
      type: string
      enum: [recibida, en_proceso, completada, persona_no_encontrada, fallida, cancelada]
      description: |
        `completada`, `persona_no_encontrada`, `fallida` y `cancelada` son
        finales y no cambian nunca.

        Es el estado de la evaluación, no el de la persona (de Prospecto a
        Cliente cerrado, `docs/modelo-de-la-persona.md`), que la v1 no expone.
        Si se expone, va con otro nombre (`estadoDeLaPersona`): los dos no se
        llaman «estado» en el mismo lugar. Ojo con `en_proceso`: es también
        como se llama el segundo estado de la persona (decidido el
        2026-10-18), y los dos valores no pueden convivir con el mismo
        código.

    Evaluacion:
      type: object
      required: [id, estado, referencia, recibidaEl, plazoHasta]
      properties:
        id:
          $ref: '#/components/schemas/IdEvaluacion'
        estado:
          $ref: '#/components/schemas/Estado'
        modalidad:
          type: string
          enum: [basico, pro, plus]
          description: La modalidad con la que se evaluó. En `basico`, `resultado.capacidadDePago` es `null`.
        etapa:
          type: string
          enum: [perfil, buro, analisis, capacidad]
          description: |
            El paso que corre, sólo mientras está `en_proceso`. Son los pasos de
            la modalidad: `perfil` (las fuentes y el perfil de ingresos), `buro`
            (sólo `plus`), `analisis` (el modelo) y `capacidad` (sólo `pro` y `plus`).
        referencia:
          $ref: '#/components/schemas/Referencia'
        recibidaEl:
          type: string
          format: date-time
        terminadaEl:
          type: string
          format: date-time
        plazoHasta:
          type: string
          format: date-time
          description: Hasta cuándo puede seguir en curso (15 minutos si es interactiva, 24 horas si es diferida).
        reemplazaA:
          $ref: '#/components/schemas/IdEvaluacion'
        resultado:
          $ref: '#/components/schemas/Resultado'
        disponibilidad:
          $ref: '#/components/schemas/Disponibilidad'
        perfil:
          type: object
          description: |
            El perfil estandarizado, sólo si la configuración de la IFI lo
            habilita y el pedido no lo rechazó. Su forma sigue la estructura
            estandarizada de la versión `versiones.estructura`. Nunca trae el
            crudo de las fuentes.
          additionalProperties: true
        fallo:
          $ref: '#/components/schemas/Fallo'
        versiones:
          $ref: '#/components/schemas/Versiones'
        trazabilidad:
          $ref: '#/components/schemas/Trazabilidad'
        variabilidadDeclarada:
          type: string
          example: El mismo perfil analizado dos veces puede variar unos 40 puntos.
    Resultado:
      type: object
      required: [veredictoOrigen, requiereRevisionHumana, controlesDeBloqueo]
      description: Todo lo que produce el análisis. Presente cuando la evaluación está `completada`.
      properties:
        score:
          type: [integer, 'null']
          minimum: 1
          maximum: 999
          description: '`null` con `veredictoOrigen: sin_veredicto`. Nunca se rellena un valor por defecto.'
        recomendacion:
          type: [string, 'null']
          enum: [aprobar, revisar, negar, null]
          description: '`null` con `veredictoOrigen: sin_veredicto`. Con `completitud: parcial` nunca es "aprobar".'
        veredictoOrigen:
          type: string
          enum: [modelo, control_bloqueo, sin_veredicto]
          description: |
            `control_bloqueo`: una regla fija negó (score 1 y "negar"), diga lo
            que diga el modelo. `sin_veredicto`: el modelo no estuvo
            disponible o se negó a responder.
        indicadorRiesgo:
          type: [string, 'null']
          enum: [muy bajo, bajo, moderado, alto, muy alto, null]
        indicadorHistorial:
          type: [string, 'null']
          enum: [excelente, bueno, regular, malo, sin historial, null]
        positivos:
          type: array
          items:
            type: string
            maxLength: 1000
        negativos:
          type: array
          items:
            type: string
            maxLength: 1000
        informacionFaltante:
          type: array
          items:
            type: string
            maxLength: 1000
        accionesSugeridas:
          type: array
          maxItems: 5
          items:
            type: string
            maxLength: 1000
        razonamiento:
          type: [string, 'null']
          maxLength: 20000
          description: Texto libre del modelo. La IFI lo muestra como texto, sin interpretarlo como HTML.
        controlesDeBloqueo:
          $ref: '#/components/schemas/ControlesDeBloqueo'
        capacidadDePago:
          description: En las modalidades `pro` y `plus`, la cuota y la capacidad de pago (lo mismo que `POST /capacidades-de-pago`, medida con lo que se supo de la persona en esta evaluación y su `ingresoDeclarado`, si lo hubo). En `basico` es `null`. Va aparte de la recomendación del modelo; la capacidad no cambia el score.
          oneOf:
            - $ref: '#/components/schemas/RespuestaDeCapacidad'
            - type: 'null'
        requiereRevisionHumana:
          type: boolean
          const: true
          description: La decisión de crédito la toma una persona de la IFI.

    ControlesDeBloqueo:
      type: object
      required: [bloqueado, hallazgos]
      properties:
        bloqueado:
          type: boolean
        hallazgos:
          type: array
          items:
            type: object
            required: [codigo, mensaje, bloqueante]
            properties:
              codigo:
                type: string
                enum: [fallecido, cedula_inconsistente, lista_control, lista_negra, listas_control_interno, pep, homonimo_en_lista_control, delito_seguridad_ciudadana]
              mensaje:
                type: string
              bloqueante:
                type: boolean
                description: '`false`: se informa, pero no fuerza la negación (por ejemplo, una persona expuesta políticamente o un homónimo).'

    Disponibilidad:
      type: object
      required: [completitud, temasNoConsultados]
      properties:
        completitud:
          type: string
          enum: [completa, parcial]
          description: '`parcial`: faltó al menos un tema crítico después de reintentar las fuentes que fallaron.'
        temasNoConsultados:
          type: array
          description: Temas cuya fuente no respondió. Nada de lo que no se consultó se presenta como "no tiene".
          items:
            type: string
          example: [cooperativas]

    Fallo:
      type: object
      required: [codigo]
      description: |
        Presente cuando la evaluación está `fallida`. `codigo` es para
        decidir qué hacer sin leer el texto; `detalle` es para una persona.

        | `codigo` | Qué pasó | Qué hacer |
        |---|---|---|
        | `fuentes_no_disponibles` | Las fuentes de datos no respondieron. No se guardó ningún perfil. | Reintentar más tarde. |
        | `plazo_vencido` | La evaluación no terminó dentro de su plazo. | Pedirla de nuevo. |
        | `identificacion_no_encontrada` | La fuente no conoce la identificación, o el buró no la acepta. No se consultó nada más. | Revisar la identificación; reintentar no cambia nada. |
        | `buro_requiere_consulta_previa` | Reservado. En `plus`, si la persona no tiene una consulta vigente del buró de la IFI, la API la consulta (y se cobra, hasta el tope diario): hoy la API no produce este código. | — |
        | `tope_diario_agotado` | Se llegó al tope diario de consultas al buró (cada una se cobra). | Reintentar al día siguiente. |
        | `buro_no_disponible` | El buró no se pudo consultar (está apagado, no contestó o contestó por otra identificación). La consulta pudo haberse cobrado: si quedó guardada, al reintentar se reutiliza. | Reintentar en unos minutos; si se repite, avisar a CrediScope. |
        | `error_interno` | Falló algo de CrediScope. | Reintentar; si se repite, avisar a CrediScope. |
      properties:
        codigo:
          type: string
          enum:
            - fuentes_no_disponibles
            - plazo_vencido
            - identificacion_no_encontrada
            - buro_requiere_consulta_previa
            - tope_diario_agotado
            - buro_no_disponible
            - error_interno
        detalle:
          type: string

    Versiones:
      type: object
      required: [api, marco, estructura, fuentesIngreso, modelo]
      description: Con qué versión de cada pieza se hizo la evaluación. Dos evaluaciones sólo son comparables con las mismas versiones.
      properties:
        api:
          type: string
          example: 1.0.0
        marco:
          type: [string, 'null']
          example: marco-v30
        estructura:
          type: [string, 'null']
          example: estructura-v13
        fuentesIngreso:
          type: [string, 'null']
          example: fuentes-v10
        modelo:
          type: [string, 'null']
          description: El modelo que contestó, que puede no ser el pedido si el proveedor reintentó en otro. `null` si no hubo análisis del modelo.
          example: claude-sonnet-5-5

    Trazabilidad:
      type: object
      properties:
        consultadaEl:
          type: [string, 'null']
          format: date-time
          description: Cuándo se consultaron las fuentes (si se reutilizó un perfil, la fecha de ese perfil).
        analizadaEl:
          type: [string, 'null']
          format: date-time
        perfilReutilizado:
          type: boolean
        analisisReutilizado:
          type: boolean
          description: El pedido al modelo era idéntico a uno anterior de la misma persona y se reutilizó su análisis.
        huellaDelPedidoAlModelo:
          type: [string, 'null']
          pattern: '^sha256:[0-9a-f]{64}$'

    ListaDeEvaluaciones:
      type: object
      required: [evaluaciones]
      properties:
        evaluaciones:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Evaluacion'

    Decision:
      type: object
      additionalProperties: false
      required: [decision, decididaEl, decididaPor]
      properties:
        decision:
          type: string
          enum: [aprobado, rechazado, aprobado_con_condiciones, desistido]
          description: |
            La decisión de la institución sobre la solicitud: Aprobado o
            Rechazado, como en el modelo de la persona del negocio
            (2026-10-12). No es la recomendación del modelo (`aprobar`,
            `revisar`, `negar`), y por eso usa otra palabra.
        decididaEl:
          type: string
          format: date-time
        decididaPor:
          type: string
          minLength: 1
          maxLength: 64
          description: El id, en la IFI, de la persona que decidió.
        montoAprobado:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.01
        plazoMesesAprobado:
          type: integer
          minimum: 1
          maximum: 480
        motivo:
          type: string
          maxLength: 1000

    Aviso:
      type: object
      required: [tipo, id, estado, referencia, ocurridoEl]
      properties:
        tipo:
          type: string
          const: evaluacion.terminada
        id:
          $ref: '#/components/schemas/IdEvaluacion'
        estado:
          $ref: '#/components/schemas/Estado'
        referencia:
          $ref: '#/components/schemas/Referencia'
        ocurridoEl:
          type: string
          format: date-time

    PedidoDeSimulacion:
      type: object
      additionalProperties: false
      required: [monto, plazoMeses]
      properties:
        monto:
          type: number
          minimum: 1000
          maximum: 120000
          multipleOf: 0.01
          description: En dólares. El producto de consumo va de 1.000 a 120.000.
        plazoMeses:
          type: integer
          minimum: 6
          maximum: 120
          description: En meses. El producto de consumo va de 6 a 120.
        tasaNominalAnualPorcentaje:
          type: number
          minimum: 0
          maximum: 15.6
          description: Nominal anual, en porcentaje (15 quiere decir 15%). Opcional; sin ella se evalúa con la Tasa máxima del producto (15,6% para consumo). Va de la Tasa mínima (0%, financiamiento sin interés) a la Tasa máxima; nunca negativa.
        sistema:
          type: string
          enum: [frances, aleman]
          default: frances
          description: '`frances`: cuota fija de capital e interés. `aleman`: capital fijo.'
        desgravamen:
          $ref: '#/components/schemas/Desgravamen'
          description: Si no se manda, 0,6% anual sobre el saldo de cada mes. Se manda completo (los tres campos) o no se manda.
        incluirTabla:
          type: boolean
          default: true
          description: Si la respuesta trae la tabla de amortización. En `solicitud` de `POST /capacidades-de-pago` no tiene efecto, porque esa respuesta nunca trae la tabla.

    Desgravamen:
      type: object
      additionalProperties: false
      required: [tasaPorcentaje, periodicidad, base]
      properties:
        tasaPorcentaje:
          type: number
          minimum: 0
          description: En porcentaje (0.6 quiere decir 0,6%).
        periodicidad:
          type: string
          enum: [anual, mensual]
          description: Si la tasa es anual se divide para 12.
        base:
          type: string
          enum: [saldo, monto]
          description: Sobre qué se cobra cada mes.

    Simulacion:
      type: object
      required: [version, monto, plazoMeses, tasaNominalAnualPorcentaje, sistema, desgravamen, tasaMensual, tasaEfectivaAnual, cuotaPrimerMes, cuotaUltimoMes, capitalEInteresPrimerMes, seguroPrimerMes, totalInteres, totalSeguro, totalPagado]
      properties:
        version:
          type: string
        monto:
          type: number
        plazoMeses:
          type: integer
        tasaNominalAnualPorcentaje:
          type: number
        sistema:
          type: string
          enum: [frances, aleman]
        desgravamen:
          $ref: '#/components/schemas/Desgravamen'
        tasaMensual:
          type: number
          description: Fracción (0.0125 es 1,25% al mes), sin redondear.
        tasaEfectivaAnual:
          type: number
          description: Fracción, sin redondear. La equivalente a la nominal, sin el seguro.
        cuotaPrimerMes:
          type: number
          description: La cuota total del primer mes, la más alta. Es la que mide la capacidad de pago.
        cuotaUltimoMes:
          type: number
        capitalEInteresPrimerMes:
          type: number
        seguroPrimerMes:
          type: number
        totalInteres:
          type: number
        totalSeguro:
          type: number
        totalPagado:
          type: number
        tabla:
          type: array
          items:
            $ref: '#/components/schemas/FilaDeAmortizacion'

    FilaDeAmortizacion:
      type: object
      required: [mes, saldoInicial, capital, interes, seguro, cuota, saldoFinal]
      properties:
        mes:
          type: integer
        saldoInicial:
          type: number
        capital:
          type: number
        interes:
          type: number
        seguro:
          type: number
        cuota:
          type: number
        saldoFinal:
          type: number

    RespuestaDeSimulacion:
      type: object
      required: [simulacion]
      properties:
        simulacion:
          $ref: '#/components/schemas/Simulacion'

    PedidoDeEstimacion:
      type: object
      additionalProperties: false
      required: [identificacion]
      properties:
        identificacion:
          type: string
          pattern: '^[0-9]{10}([0-9]{3})?$'
          description: Cédula o RUC de persona natural de alguien ya consultado. Se valida el dígito verificador.
        evaluacion:
          $ref: '#/components/schemas/IdEvaluacion'
          description: La evaluación de esa misma persona a la que pertenece la estimación, si la hay.

    IngresoVerificado:
      type: object
      additionalProperties: false
      required: [origen, salarioReportado, aportePersonal, ingresoNeto, mes]
      properties:
        origen:
          type: string
          const: IESS
        salarioReportado:
          type: number
          description: Lo que reporta un tercero al IESS por mes, en dólares.
        aportePersonal:
          type: number
          description: El aporte personal al IESS que se descuenta del salario.
        ingresoNeto:
          type: number
          description: El salario menos el aporte personal.
        mes:
          type: [string, 'null']
          description: Mes del corte del IESS, `AAAA-MM`.

    MinimoDeIngreso:
      type: object
      additionalProperties: false
      required: [seguridad, monto, limiteDeMedioSbuAplicado]
      properties:
        seguridad:
          type: number
          description: Con qué seguridad el ingreso real supera este monto, como fracción.
        monto:
          type: number
          description: En dólares por mes.
        limiteDeMedioSbuAplicado:
          type: boolean
          description: Si el monto es la mitad del salario básico del año porque el modelo dio menos.

    TramoDeIngreso:
      type: object
      additionalProperties: false
      required: [desde, hasta, probabilidad]
      properties:
        desde:
          type: number
        hasta:
          type: [number, 'null']
          description: '`null` en el último tramo, que no tiene tope.'
        probabilidad:
          type: number
          description: Como fracción. Las de todos los tramos suman uno.

    IngresoEstimado:
      type: object
      additionalProperties: false
      required: [aplica, rotulo, minimoCertificado, minimoAlternativo, valorCentral, tramos, certificaAlMenos]
      properties:
        aplica:
          type: boolean
          const: true
        rotulo:
          type: string
          enum: ['Ingreso estimado, sin verificar', 'Referencia de solicitantes']
          description: Hasta un mínimo de USD 1.000, el resultado distingue poco a la persona de los solicitantes y se rotula como referencia.
        minimoCertificado:
          $ref: '#/components/schemas/MinimoDeIngreso'
          description: El mínimo con 90% de seguridad.
        minimoAlternativo:
          $ref: '#/components/schemas/MinimoDeIngreso'
          description: El mínimo con 85% de seguridad.
        valorCentral:
          type: number
          description: La mediana del modelo. No se usa para medir la capacidad de pago.
        tramos:
          type: array
          description: La probabilidad de cada tramo. Los dos primeros cortes siguen al salario básico del año de la consulta.
          items:
            $ref: '#/components/schemas/TramoDeIngreso'
        certificaAlMenos:
          type: array
          description: Los umbrales que alcanza el mínimo certificado.
          items:
            type: number

    IngresoSinEstimar:
      type: object
      additionalProperties: false
      required: [aplica, motivo]
      properties:
        aplica:
          type: boolean
          const: false
        motivo:
          type: string
          enum: [ingreso_verificado, jubilado, dependiente_sin_monto, sin_datos]
          description: |
            - `ingreso_verificado`: un tercero lo reporta y no se estima.
            - `jubilado`: la referencia de pensión todavía no se entrega.
            - `dependiente_sin_monto`: trabaja para un tercero y el IESS no trae el monto.
            - `sin_datos`: la consulta no alcanza para clasificar de qué vive la persona.

    EstimacionDeIngreso:
      type: object
      additionalProperties: false
      required: [id, version, nivel, consultadoEl, verificado, estimado, referencia, calidad, modelo]
      properties:
        id:
          type: [string, 'null']
          format: uuid
          description: La estimación guardada. `null` si no se evaluó el modelo.
        version:
          type: [string, 'null']
          description: Versión del modelo. `null` si no se evaluó.
        nivel:
          type: [integer, 'null']
          enum: [0, 1, 2, null]
          description: Con qué se respondió. `null` si no hay ni verificado ni estimado.
        consultadoEl:
          type: string
          format: date-time
          description: La fecha de la consulta con que se respondió.
        verificado:
          oneOf:
            - $ref: '#/components/schemas/IngresoVerificado'
            - type: 'null'
        estimado:
          oneOf:
            - $ref: '#/components/schemas/IngresoEstimado'
            - $ref: '#/components/schemas/IngresoSinEstimar'
        referencia:
          type: 'null'
          description: Reservado para la referencia de pensión, que todavía no se entrega.
        calidad:
          type: object
          additionalProperties: false
          required: [variablesUsadas, variablesSinDato, avisos]
          properties:
            variablesUsadas:
              type: integer
            variablesSinDato:
              type: integer
              description: Una variable sin dato no corta la estimación, pero baja la precisión.
            avisos:
              type: array
              items:
                type: string
        modelo:
          oneOf:
            - type: object
              additionalProperties: false
              required: [poblacion, calibradoPara, entrenadoEl]
              properties:
                poblacion:
                  type: string
                  description: Con quién se entrenó el modelo.
                calibradoPara:
                  type: [string, 'null']
                  description: La institución con cuyos casos se calibró el mínimo. `null` si no se calibró.
                entrenadoEl:
                  type: string
                  format: date
            - type: 'null'

    PedidoDeCapacidad:
      type: object
      additionalProperties: false
      required: [solicitud]
      description: Con `identificacion`, o con `ingresos` y `obligaciones`. Si vienen las dos cosas, manda la identificación.
      properties:
        identificacion:
          type: string
          pattern: '^[0-9]{10}([0-9]{3})?$'
          description: Cédula o RUC de persona natural de alguien ya consultado. Se valida el dígito verificador.
        ingresos:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/IngresoMensual'
        obligaciones:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ObligacionMensual'
        deudasSinCuota:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/DeudaSinCuota'
        ingresoDeclarado:
          type: number
          minimum: 0
          description: Lo que la persona dice que recibe por mes, en dólares. Reemplaza al ingreso del IESS en el cálculo y se marca sin verificar. Con 0 no reemplaza nada.
        solicitud:
          $ref: '#/components/schemas/PedidoDeSimulacion'
          description: Las condiciones del crédito, las mismas de `POST /simulaciones`.
        parametros:
          $ref: '#/components/schemas/ParametrosDeCapacidad'

    IngresoMensual:
      type: object
      additionalProperties: false
      required: [montoMensual, tipo]
      properties:
        concepto:
          type: string
          maxLength: 200
        montoMensual:
          type: number
          minimum: 0
          description: Lo que se reporta, antes del aporte personal al IESS.
        tipo:
          type: string
          enum: [sueldo, aporte_propio, declarado]
          description: Al `sueldo` se le descuenta el aporte personal; al `aporte_propio` y al `declarado`, no.
        origen:
          type: string
          maxLength: 100
        esIngresoMinimoSbu:
          type: boolean

    ObligacionMensual:
      type: object
      additionalProperties: false
      required: [montoMensual]
      properties:
        concepto:
          type: string
          maxLength: 200
        montoMensual:
          type: number
          minimum: 0
        origen:
          type: string
          maxLength: 100

    DeudaSinCuota:
      type: object
      additionalProperties: false
      required: [concepto]
      properties:
        concepto:
          type: string
          maxLength: 200
        saldo:
          type: [number, 'null']
          description: '`null` cuando se sabe que existe pero no el saldo.'
        origen:
          type: string
          maxLength: 100

    ParametrosDeCapacidad:
      type: object
      additionalProperties: false
      properties:
        cargaMaxima:
          type: number
          minimum: 0
          maximum: 1
          default: 0.4
          description: Tope de las cuotas sobre el ingreso neto, como fracción.
        margenJusto:
          type: number
          minimum: 0
          maximum: 1
          default: 0.05
          description: Desde cuántos puntos por debajo del tope el veredicto es `justo`.
        aportePersonalIess:
          type: number
          minimum: 0
          maximum: 1
          default: 0.0945

    Capacidad:
      type: object
      required: [version, veredicto, cumple, ingresoReportado, aportePersonal, ingresoNeto, obligacionesActuales, cuotaNueva, cargaActual, cargaConElCredito, cargaMaxima, cuotaMaximaAdmisible, holgura, disponibleDespues, obligacionesIncompletas, ingresoSoloSbu, ingresoDeclarado, avisos, parametros]
      properties:
        version:
          type: string
        veredicto:
          type: string
          enum: [alcanza, justo, no_alcanza, sin_ingreso]
          description: '`sin_ingreso`: no hay un ingreso con el que medir la cuota; no es un rechazo.'
        cumple:
          type: [boolean, 'null']
          description: |
            Si la cuota entra en el ingreso, sí o no. `true` con `alcanza` y `justo`
            (la cuota está dentro del tope, aunque cerca), `false` con `no_alcanza`,
            y `null` con `sin_ingreso`: no hay con qué medir y eso no es un rechazo.
            Un `true` con `obligacionesIncompletas` es un sí sobre lo que se pudo
            contar. Es un derivado del `veredicto`: no agrega criterio.
        ingresoReportado:
          type: number
        aportePersonal:
          type: number
        ingresoNeto:
          type: number
        obligacionesActuales:
          type: number
        cuotaNueva:
          type: number
        cargaActual:
          type: [number, 'null']
        cargaConElCredito:
          type: [number, 'null']
        cargaMaxima:
          type: number
        cuotaMaximaAdmisible:
          type: number
        holgura:
          type: number
          description: Cuota máxima admisible menos la cuota pedida. Negativa si no alcanza, también cuando las cuotas actuales ya pasan el tope (incluye ese exceso).
        disponibleDespues:
          type: number
        obligacionesIncompletas:
          type: boolean
          description: Lo que paga por mes es más de lo que se cuenta, porque hay deudas sin cuota, cuotas sin un monto válido o fuentes que no contestaron.
        ingresoSoloSbu:
          type: boolean
        ingresoDeclarado:
          type: boolean
          description: El ingreso con que se midió es el que declara la persona, sin verificar.
        avisos:
          type: array
          description: Frases listas para mostrar (sin ingreso, deudas sin cuota, ingreso sin verificar, ingreso mínimo).
          items:
            type: string
        parametros:
          $ref: '#/components/schemas/ParametrosDeCapacidad'
          description: Los parámetros con que se midió, con los valores por defecto ya aplicados.

    DatosDeCapacidad:
      type: object
      required: [ingresos, obligaciones, deudasSinCuota, fuenteDeLasCuotas, corteIess]
      description: Con qué ingresos y cuotas se midió la capacidad. Con un Ingreso declarado, el único ingreso es el declarado.
      properties:
        ingresos:
          type: array
          items:
            $ref: '#/components/schemas/IngresoMensual'
        obligaciones:
          type: array
          items:
            $ref: '#/components/schemas/ObligacionMensual'
        deudasSinCuota:
          type: array
          description: Deudas que existen pero cuya cuota no se conoce. No se cuentan como cero (`obligacionesIncompletas` es `true`).
          items:
            $ref: '#/components/schemas/DeudaSinCuota'
        fuenteDeLasCuotas:
          type: string
          enum: [equifax, novadata]
          description: De dónde salen las cuotas de las obligaciones. Con los datos de la IFI es `novadata` y no quiere decir nada.
        corteIess:
          type: [string, 'null']
          pattern: '^[0-9]{4}-[0-9]{2}$'
          description: El mes del IESS con el que se clasificó el ingreso. `null` con los datos de la IFI.
        fuentesSinConsultar:
          type: array
          description: Temas de cuotas cuya fuente no contestó (por ejemplo, casas comerciales). No se sabe si la persona debe ahí, y `obligacionesIncompletas` es `true`. Sólo con `persona`.
          items:
            type: string

    Procedencia:
      type: object
      required: [modo]
      description: De dónde salieron los datos de la capacidad.
      properties:
        modo:
          type: string
          enum: [persona, datos_del_pedido]
          description: '`persona`: lo que CrediScope sabía de ella. `datos_del_pedido`: lo que mandó la IFI.'
        perfilDel:
          type: string
          format: date-time
          description: Cuándo se consultó el perfil que se usó. Sólo con `persona`.
        buroDeLaInstitucion:
          type: [string, 'null']
          description: El buró elegido por la IFI (`equifax` o `aval`), o `null` si no eligió. Sólo con `persona`.
        equifaxDel:
          type: [string, 'null']
          format: date-time
          description: Cuándo se hizo la consulta de Equifax de la que salen las cuotas, o `null` si no se usó. Sólo con `persona`.

    RespuestaDeCapacidad:
      type: object
      required: [capacidad, simulacion, montoMaximo]
      properties:
        capacidad:
          $ref: '#/components/schemas/Capacidad'
        simulacion:
          $ref: '#/components/schemas/Simulacion'
        montoMaximo:
          type: [number, 'null']
          description: El monto más alto que alcanza con el mismo plazo y la misma tasa. `0` si no queda margen para ninguna cuota.
        capacidadSoloIess:
          description: Con `identificacion` e `ingresoDeclarado`, el resultado con sólo el ingreso reportado al IESS. Si no, `null`.
          oneOf:
            - $ref: '#/components/schemas/Capacidad'
            - type: 'null'
        datos:
          $ref: '#/components/schemas/DatosDeCapacidad'
        procedencia:
          $ref: '#/components/schemas/Procedencia'
          description: Sólo en la respuesta de `POST /capacidades-de-pago`; dentro de una evaluación no va.

    Salud:
      type: object
      required: [estado, version]
      properties:
        estado:
          type: string
          enum: [operativo, degradado, no_disponible]
          description: '`degradado`: recibe evaluaciones, pero alguna fuente o el modelo no responde y las esperas son mayores.'
        version:
          type: string

    Problema:
      type: object
      required: [type, title, status, codigo, idPedido]
      description: Error según RFC 9457, con dos campos propios, `codigo` e `idPedido`.
      properties:
        type:
          type: string
          format: uri
          description: Dirección de la explicación del error.
          example: https://api.crediscope.example/problemas/identificacion-invalida
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        codigo:
          type: string
          enum:
            - cuerpo-invalido
            - identificacion-invalida
            - falta-clave-de-idempotencia
            - no-autenticado
            - sin-permiso
            - no-encontrada
            - clave-reutilizada
            - referencia-reutilizada
            - estado-no-permite
            - cuerpo-demasiado-grande
            - tipo-no-soportado
            - autorizacion-insuficiente
            - limite-de-velocidad
            - cuota-agotada
            - capacidad-agotada
            - servicio-no-disponible
            - error-interno
        idPedido:
          type: string
          description: El mismo valor que el encabezado `X-Request-Id`.
        errores:
          type: array
          description: Con `cuerpo-invalido`, qué campo falló y por qué.
          items:
            type: object
            required: [campo, motivo]
            properties:
              campo:
                type: string
                description: Puntero JSON (RFC 6901) al campo.
              motivo:
                type: string
              codigo:
                $ref: '#/components/schemas/ErrorDeCondiciones'

    ErrorDeCondiciones:
      type: string
      description: |
        El código de un error de las condiciones del crédito (simulación,
        capacidad de pago y evaluación en `pro` y `plus`). No cambia aunque
        cambie el texto de `motivo`: la IFI decide con el código.

        | Código | Significado |
        |---|---|
        | `faltan-condiciones` | No llegaron las condiciones del crédito. |
        | `monto-invalido` | El monto no es un número mayor que cero. |
        | `monto-con-mas-de-dos-decimales` | El monto tiene más de dos decimales (centavos). |
        | `monto-fuera-de-limites` | El monto está fuera del mínimo y el máximo del producto (consumo: de 1.000 a 120.000 dólares). |
        | `plazo-fuera-de-limites` | El plazo no es un número entero de meses dentro del mínimo y el máximo del producto (consumo: de 6 a 120). |
        | `tasa-invalida` | La tasa no es un número. |
        | `tasa-menor-que-la-minima` | La tasa es menor que la Tasa mínima del producto (0%): nunca negativa. |
        | `tasa-mayor-que-la-maxima` | La tasa es mayor que la Tasa máxima del producto (consumo: 15,6%). |
        | `tasa-del-producto-invalida` | La Tasa máxima o la Tasa mínima configuradas no son válidas: es un error de configuración de la institución, no del pedido. |
        | `desgravamen-invalido` | El seguro de desgravamen no trae tasa (no negativa), periodicidad (`anual` o `mensual`) y base (`saldo` o `monto`). |
        | `sistema-invalido` | El sistema de amortización no es `frances` ni `aleman`. |
      enum:
        - faltan-condiciones
        - monto-invalido
        - monto-con-mas-de-dos-decimales
        - monto-fuera-de-limites
        - plazo-fuera-de-limites
        - tasa-invalida
        - tasa-menor-que-la-minima
        - tasa-mayor-que-la-maxima
        - tasa-del-producto-invalida
        - desgravamen-invalido
        - sistema-invalido

  responses:
    PedidoInvalido:
      description: El pedido no cumple el contrato, la identificación no es válida o falta la clave de idempotencia.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            identificacionInvalida:
              value:
                type: https://api.crediscope.example/problemas/identificacion-invalida
                title: Identificación inválida
                status: 400
                detail: El dígito verificador no coincide.
                codigo: identificacion-invalida
                idPedido: ped_8f3a2c1d9e
            cuerpoInvalido:
              value:
                type: https://api.crediscope.example/problemas/cuerpo-invalido
                title: El pedido no cumple el contrato
                status: 400
                codigo: cuerpo-invalido
                idPedido: ped_8f3a2c1d9e
                errores:
                  - campo: /autorizacion/huellaDelDocumento
                    motivo: Tiene que ser sha256 seguido de 64 caracteres hexadecimales.
    NoAutenticado:
      description: Falta la ficha, venció o su firma no es válida.
      headers:
        WWW-Authenticate:
          description: Esquema y motivo (RFC 6750).
          schema:
            type: string
            example: Bearer error="invalid_token"
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://api.crediscope.example/problemas/no-autenticado
            title: Ficha no válida
            status: 401
            codigo: no-autenticado
            idPedido: ped_8f3a2c1d9e
    SinPermiso:
      description: El alcance de la ficha no incluye la operación, o la IP no está permitida.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://api.crediscope.example/problemas/sin-permiso
            title: Sin permiso para esta operación
            status: 403
            codigo: sin-permiso
            idPedido: ped_8f3a2c1d9e
    NoEncontrada:
      description: No existe, o es de otra IFI. A propósito, las dos se responden igual.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://api.crediscope.example/problemas/no-encontrada
            title: Evaluación no encontrada
            status: 404
            codigo: no-encontrada
            idPedido: ped_8f3a2c1d9e
    ClaveReutilizada:
      description: |
        La misma clave de idempotencia ya se usó con otro cuerpo
        (`clave-reutilizada`), o la referencia ya tiene una evaluación
        (`referencia-reutilizada`; para pedir de nuevo el análisis de la misma
        persona se usa `reemplazaA`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://api.crediscope.example/problemas/clave-reutilizada
            title: Clave de idempotencia ya usada con otro pedido
            status: 409
            codigo: clave-reutilizada
            idPedido: ped_8f3a2c1d9e
    EstadoNoPermite:
      description: El estado de la evaluación no permite la operación (por ejemplo, cancelar cuando ya se consultaron las fuentes).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://api.crediscope.example/problemas/estado-no-permite
            title: La evaluación ya consultó las fuentes
            status: 409
            codigo: estado-no-permite
            idPedido: ped_8f3a2c1d9e
    CuerpoDemasiadoGrande:
      description: El cuerpo supera los 16 KB.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://api.crediscope.example/problemas/cuerpo-demasiado-grande
            title: Pedido demasiado grande
            status: 413
            codigo: cuerpo-demasiado-grande
            idPedido: ped_8f3a2c1d9e
    TipoNoSoportado:
      description: El cuerpo no es `application/json`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://api.crediscope.example/problemas/tipo-no-soportado
            title: Tipo de contenido no soportado
            status: 415
            codigo: tipo-no-soportado
            idPedido: ped_8f3a2c1d9e
    AutorizacionInsuficiente:
      description: La autorización del titular falta, venció o no cubre la finalidad.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://api.crediscope.example/problemas/autorizacion-insuficiente
            title: Autorización del titular insuficiente
            status: 422
            detail: La autorización venció.
            codigo: autorizacion-insuficiente
            idPedido: ped_8f3a2c1d9e
    LimiteExcedido:
      description: Superó su tope por minuto (`limite-de-velocidad`) o su cuota del día o del mes (`cuota-agotada`).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://api.crediscope.example/problemas/limite-de-velocidad
            title: Demasiados pedidos
            status: 429
