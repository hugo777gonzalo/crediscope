# Config del Supabase CLI para este proyecto (Edge Functions locales/deploy).

[functions.explore-novadata]
# Hasta el 2026-10-09 iba sin JWT ("se usa antes de tener una sesión"):
# eso la dejaba abierta a cualquiera para probar credenciales de
# Novadata y consultar personas sin rastro. La pantalla ya era sólo de
# admin; ahora la función exige sesión y rol admin (ver su index.ts).
verify_jwt = true

# El vigía y el trabajador de lotes los dispara el programador de tareas
# de la base (pg_cron + pg_net), que manda un encabezado propio y no un
# JWT de usuario: no hay sesión detrás de una tarea programada. Se
# autentican con VIGIA_CLAVE, una clave dedicada que NO es la de
# servicio -- ver el chequeo de x-vigia-clave en cada uno.
#
# Queda escrito acá, y no solo en la línea de comandos con que se
# desplegó, porque un ajuste de seguridad que vive en la memoria de
# quien despliega no es un ajuste: el 2026-09-16 se desplegaron estas
# cuatro funciones con --no-verify-jwt de una y eso abrió dos que no
# debían abrirse.
[functions.vigia]
verify_jwt = false

[functions.procesar-lote]
verify_jwt = false

# Las dos que SÍ exigen sesión de usuario. Se listan explícitamente
# aunque true sea el valor por defecto: lo que está escrito se revisa,
# lo que se omite se asume.
[functions.structure-client]
verify_jwt = true

[functions.analyze-client]
verify_jwt = true

# Consulta al buró Aval: persiste en consultas_aval y consulta un buró de
# crédito, así que exige sesión de usuario igual que las dos de arriba.
[functions.consultar-aval]
verify_jwt = true

# Consulta al buró Equifax: cada consulta se cobra y no hay tope del
# proveedor. Exige sesión y rol dentro de la función, antes de leer el cuerpo.
[functions.consultar-equifax]
verify_jwt = true

# Simulador y capacidad de pago: cada módulo con su propia puerta (pedido del
# negocio del 2026-10-17). Exigen sesión y rol dentro de la función, antes de
# leer el cuerpo. capacidad-de-pago lee el perfil de una persona; no consulta
# a ninguna fuente.
[functions.simular-credito]
verify_jwt = true

[functions.capacidad-de-pago]
verify_jwt = true

# El predictor de ingresos, con su propia puerta (140). Exige sesión y rol dentro
# de la función, antes de leer el cuerpo. Lee el perfil guardado: no consulta a
# ninguna fuente ni al modelo de lenguaje.
[functions.estimar-ingreso]
verify_jwt = true

# El orquestador de las solicitudes (133): corre un paso por llamada y llama a
# las otras funciones con la sesión de quien pidió. Exige sesión y rol antes
# de leer el cuerpo.
[functions.evaluar-solicitud]
verify_jwt = true

# La cola de la API (137). El trabajador lo despierta la agenda de la base y él
# mismo, sin sesión de usuario: se autentica con VIGIA_CLAVE como el vigía y el
# trabajador de lotes. Corre los pasos que cobran al buró y gastan modelo, por
# eso no tiene otra puerta: la clave se compara en tiempo constante.
[functions.procesar-evaluaciones]
verify_jwt = false

# La puerta de la API para instituciones. Sin JWT en el portón porque se
# autentica ella misma, ANTES de leer el cuerpo (identificarActor + rol admin):
# la especificación pide el 401 en formato RFC 9457 y `/salud` sin ficha, y el
# portón de Supabase contesta con su propio formato. En este núcleo sólo entra la
# sesión de un administrador (apagada para terceros hasta que exista el ambiente
# de prueba, E3); con OAuth y private_key_jwt la ficha deja de ser una sesión de
# Supabase y la autenticación cambia de lugar sin tocar este valor.
[functions.api-v1]
verify_jwt = false
