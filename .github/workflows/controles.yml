name: Controles

# Corre en cada pedido de fusión (PR) a main y en cada push a main
# (auditoría externa del 2026-10-09, E2). Hasta ese día la integración
# continua sólo compilaba y publicaba: un error llegaba a producción sin que
# nada lo frenara. Con main protegida, un PR no se fusiona si un control
# está en rojo.
#
# Los nombres de los trabajos (name:) son los que exige la protección de la
# rama: si se cambia uno, cambiarlo también en la regla de main o el PR
# queda esperando un control que ya no existe.
#
# Las acciones van fijadas por huella (SHA) y no por etiqueta: una etiqueta
# se puede mover y meter código ajeno en esta corrida. Dependabot las
# actualiza (.github/dependabot.yml).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pantalla:
    name: pantalla
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Sin las variables de Supabase compila igual: la pantalla se
      # construye y avisa en el navegador que no está configurada.
      - run: npm run build
      # La revisión de UX (habilidad revision-ux, docs/revision-ux.md): ningún
      # texto de pantalla con una palabra que el negocio retiró (piso,
      # asalariado, default, backtest...) y los formatos, la traducción de
      # errores y la navegación. Sin base ni red: leen el código.
      - run: node scripts/revisar-textos.mjs
      - run: node scripts/probar-formatos.mjs

  funciones:
    name: funciones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          # La misma que se usa en la máquina (npx deno@2.9.6).
          deno-version: v2.9.6
      # El TypeScript de las funciones no lo verifica el despliegue: hasta
      # el 2026-10-09 nunca se había chequeado (dio cero errores).
      - run: deno check --no-lock supabase/functions/*/index.ts
      # --node-modules-dir=none: con el package.json de la raíz, deno test busca
      # npm:@types/node (lo piden los tipos de supabase-js) en un node_modules que
      # este control no instala y no llega a correr. deno check no lo ve.
      - run: deno test --no-lock --node-modules-dir=none --allow-env --allow-read=supabase/functions,supabase/migrations,api supabase/functions/

  guiones:
    name: guiones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      # Los guiones no pasan por lint ni build: al menos que compilen.
      - run: for f in scripts/*.mjs scripts/_comun/*.mjs scripts/lib/*.mjs scripts/revision-de-datos/*.mjs scripts/revision-del-analisis/*.mjs scripts/banco-de-casos-de-oro/*.mjs; do node --check "$f"; done
      # El detector de eventos se prueba sin base, sin red y sin datos de
      # personas; las otras pruebas de scripts/ necesitan la base viva.
      - run: node scripts/probar-detector.mjs
      # Los detectores del crudo (revisar-crudo.mjs) sobre crudos inventados:
      # ningún otro control del PR mira el crudo, y tres errores de mezcla
      # llegaron a producción por eso. Sin base, sin red y sin datos de personas.
      - run: node scripts/probar-crudos-sinteticos.mjs
      # El formato del banco de casos de oro, que ninguna versión del marco o del
      # modelo se despliega sin pasar (2026-11-11): un caso mal escrito, o un caso
      # real con forma de cédula o de monto, no entra al repositorio público.
      - run: node scripts/probar-banco-de-casos.mjs

  secretos:
    name: secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Con el repositorio privado y el plan gratuito, GitHub deja de buscar
      # secretos en cada push: esto lo reemplaza.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
